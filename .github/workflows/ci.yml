name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, tests et compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # Vérifie aussi l'empreinte de gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Sans keystore.properties, la version de publication est compilée (R8 compris) mais pas signée.
      - name: Lint, tests unitaires, compilation
        run: ./gradlew --console=plain lintDebug testDebugUnitTest assembleDebug assembleRelease

  secrets:
    name: Secrets dans l'historique
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tout l'historique : un secret retiré d'un fichier reste lisible dans les anciens commits.
          fetch-depth: 0

      # Binaire officiel, version publiée depuis plus de deux semaines, vérifié par son empreinte.
      - name: Installer gitleaks 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Chercher des secrets (clés, mots de passe, jetons)
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  dependencies:
    name: Vulnérabilités des dépendances
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Binaire officiel, version publiée depuis plus de deux semaines, vérifié par son empreinte.
      - name: Installer OSV-Scanner 2.7.0
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

      # Les bibliothèques livrées dans l'application (app/gradle.lockfile), comparées à la base OSV.
      - name: Chercher les vulnérabilités connues
        run: '"$RUNNER_TEMP/osv-scanner" scan source --lockfile=app/gradle.lockfile'